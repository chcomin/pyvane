[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvane"
version = "2.0"
description = "Segmentation and analysis of vascular sctructures."
readme = "readme.md"

[tool.setuptools]
packages = ["pyvane"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
